server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads are limited to 2 MB by the API; allow a little headroom here.
  client_max_body_size 3m;

  # API requests go to the server container, so the browser never needs the backend's address
  # (and never sees the LLM key, which only the server has).
  location /api/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Analysing a file waits on several AI calls with retries.
    proxy_read_timeout 300s;
  }

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths serve index.html.
  location / {
    try_files $uri /index.html;
  }
}
